<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portrait Carousel</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    /* Container that forces portrait ratio */
    .portrait-frame {
      width: 100%;
      max-width: 420px;      /* adjust if needed */
      margin: auto;
      aspect-ratio: 9 / 16;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
    }

    /* Make the images fit without cropping */
    .portrait-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
  </style>
</head>
<body class="bg-dark text-light p-4">

  <div id="portraitCarousel" class="carousel slide" data-bs-ride="carousel">

    <div class="portrait-frame carousel-inner">
      <div class="carousel-item active">
        <img src="https://picsum.photos/500/900?random=1" class="d-block mx-auto">
      </div>
      <div class="carousel-item">
        <img src="https://picsum.photos/500/900?random=2" class="d-block mx-auto">
      </div>
      <div class="carousel-item">
        <img src="https://picsum.photos/500/900?random=3" class="d-block mx-auto">
      </div>
    </div>

    <button class="carousel-control-prev" type="button" data-bs-target="#portraitCarousel" data-bs-slide="prev">
      <span class="carousel-control-prev-icon"></span>
    </button>

    <button class="carousel-control-next" type="button" data-bs-target="#portraitCarousel" data-bs-slide="next">
      <span class="carousel-control-next-icon"></span>
    </button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
