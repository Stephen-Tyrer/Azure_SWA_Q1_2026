
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portrait Bootstrap Carousel Gallery</title>

  <!-- Bootstrap 5 CSS (CDN) -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />

  <style>
    /* Portrait frame: adjust ratio if you prefer 2/3 or 4/5 */
    .portrait-frame {
      aspect-ratio: 3 / 4;      /* modern browsers */
      width: 100%;
      overflow: hidden;
      border-radius: 0.75rem;
      background: #f1f3f5;      /* neutral placeholder background */
    }
    .portrait-frame > img {
      width: 100%;
      height: 100%;
      object-fit: cover;        /* fill frame without distortion, crop if needed */
      display: block;
      transition: transform .35s ease;
    }
    .portrait-frame:hover > img {
      transform: scale(1.03);
    }

    /* Nice lift on cards */
    .gallery-card {
      transition: box-shadow .25s ease, transform .25s ease;
    }
    .gallery-card:hover {
      box-shadow: 0 10px 24px rgba(0,0,0,.12);
      transform: translateY(-2px);
    }

    /* Easier-to-tap indicators */
    .carousel-indicators [data-bs-target] {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
  </style>
</head>
<body>

<header class="py-5 bg-light border-bottom">
  <div class="container">
    <h1 class="display-6 mb-1">Portrait Carousel Gallery</h1>
    <p class="text-muted mb-0">1 item per slide on mobile • 2 per slide on larger screens</p>
  </div>
</header>

<main class="py-5">
  <div class="container">

    <div id="portraitCarousel"
         class="carousel slide"
         data-bs-ride="carousel"
         data-bs-touch="true"
         data-bs-interval="6000"
         data-bs-pause="hover"
         aria-label="Portrait carousel gallery">

      <!-- Indicators -->
      <div class="carousel-indicators">
        <button type="button" data-bs-target="#portraitCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
        <button type="button" data-bs-target="#portraitCarousel" data-bs-slide-to="1" aria-label="Slide 2"></button>
        <button type="button" data-bs-target="#portraitCarousel" data-bs-slide-to="2" aria-label="Slide 3"></button>
      </div>

      <div class="carousel-inner">

        <!-- Slide 1 -->
        <div class="carousel-item active">
          <!-- 1 per slide on xs, 2 per slide on ≥sm -->
          <div class="row g-4 row-cols-1 row-cols-sm-2">
            <div class="col">
              <div class="card h-100 gallery-card">
                <div class="portrait-frame">
                  <img
                    src="https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?q=80&w=900&auto=format&fit=crop"
                    alt="Portrait of Alex in natural light"
                    loading="lazy"
                    width="900" height="1200"
                  />
                </div>
                <div class="card-body">
                  <h6 class="card-title mb-1">Alex</h6>
                  <p class="card-text small text-muted mb-0">Natural light, outdoor</p>
                </div>
              </div>
            </div>

            <div class="col">
              <div class="card h-100 gallery-card">
                <div class="portrait-frame">
                  <img
                    src="https://images.unsplash.com/photo-1544006659-f0b21884ce1d?q=80&w=900&auto=format&fit=crop"
                    alt="Portrait of Sam in studio soft light"
                    loading="lazy"
                    width="900" height="1200"
                  />
                </div>
                <div class="card-body">
                  <h6 class="card-title mb-1">Sam</h6>
                  <p class="card-text small text-muted mb-0">Studio, softbox</p>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Slide 2 -->
        <div class="carousel-item">
          <div class="row g-4 row-cols-1 row-cols-sm-2">
            <div class="col">
              <div class="card h-100 gallery-card">
                <div class="portrait-frame">
                  <img
                    src="https://images.unsplash.com/photo-1531123897727-8f129e1688ce?q=80&w=900&auto=format&fit=crop"
                    alt="Portrait of Jordan candid on a street"
                    loading="lazy"
                    width="900" height="1200"
                  />
                </div>
                <div class="card-body">
                  <h6 class="card-title mb-1">Jordan</h6>
                  <p class="card-text small text-muted mb-0">Candid, street</p>
                </div>
              </div>
            </div>

            <div class="col">
              <div class="card h-100 gallery-card">
                <div class="portrait-frame">
                  <img
                    src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?q=80&w=900&auto=format&fit=crop"
                    alt="Portrait of Taylor in editorial look"
                    loading="lazy"
                    width="900" height="1200"
                  />
                </div>
                <div class="card-body">
                  <h6 class="card-title mb-1">Taylor</h6>
                  <p class="card-text small text-muted mb-0">Editorial look</p>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Slide 3 -->
        <div class="carousel-item">
          <div class="row g-4 row-cols-1 row-cols-sm-2">
            <div class="col">
              <div class="card h-100 gallery-card">
                <div class="portrait-frame">
                  <img
                    src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?q=80&w=900&auto=format&fit=crop"
                    alt="Portrait of Morgan in monochrome mood"
                    loading="lazy"
                    width="900" height="1200"
                  />
                </div>
                <div class="card-body">
                  <h6 class="card-title mb-1">Morgan</h6>
                  <p class="card-text small text-muted mb-0">Monochrome mood</p>
                </div>
              </div>
            </div>

            <div class="col">
              <div class="card h-100 gallery-card">
                <div class="portrait-frame">
                  <img
                    src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?q=80&w=900&auto=format&fit=crop"
                    alt="Portrait of Jamie classic style"
                    loading="lazy"
                    width="900" height="1200"
                  />
                </div>
                <div class="card-body">
                  <h6 class="card-title mb-1">Jamie</h6>
                  <p class="card-text small text-muted mb-0">Classic style</p>
                </div>
              </div>
            </div>
          </div>
        </div>

      </div><!-- /.carousel-inner -->

      <!-- Controls -->
      <button class="carousel-control-prev" type="button" data-bs-target="#portraitCarousel" data-bs-slide="prev" aria-label="Previous">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#portraitCarousel" data-bs-slide="next" aria-label="Next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
      </button>
    </div>

  </div>
</main>

<!-- Bootstrap Bundle (JS + Popper) -->
<script
  src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
  crossorigin="anonymous"
></script>
</body>
</html>
``
